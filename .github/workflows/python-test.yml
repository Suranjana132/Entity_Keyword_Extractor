name: Python Application Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Download NLTK resources
        run: |
          python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Test application
        run: |
          python -c "from app import process_meeting_notes; result = process_meeting_notes('Rahul will prepare the cybersecurity presentation by 25 September.'); print(result); assert result['Action Items']"